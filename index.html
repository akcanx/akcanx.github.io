<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akcan</title>
  <meta name="description" content="Blog yazıları, YouTube videoları, podcast bölümleri ve remixler.">
  <meta name="theme-color" content="#0C0C0A">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Üst menü -->
  <nav class="nav" id="nav">
    <div class="wrap">
      <a class="brand" href="#/" id="brand">Akcan</a>
      <div class="menu">
        <span class="menu-links" id="menuLinks"></span>
        <span class="menu-social" id="menuSocial"></span>
        <button id="searchOpen" class="search-btn" aria-label="Site içinde ara" title="Ara (/ veya Ctrl+K)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
        <button id="menuOpen" class="menu-btn" aria-label="Menüyü aç" aria-expanded="false" aria-controls="navDrawer"><span class="menu-icon"></span></button>
      </div>
    </div>
    <!-- Detay sayfalarında: konum (Yazılar › Etiket) ve önceki/sonraki -->
    <div class="crail" id="crail" hidden>
      <div class="wrap crail-in">
        <nav class="crail-crumb" id="crailCrumb" aria-label="Konum"></nav>
        <div class="crail-nb" id="crailNb"></div>
      </div>
    </div>
  </nav>
  <div class="readbar" id="readbar" hidden></div>

  <!-- Mobil çekmece menü -->
  <div id="navDrawer" class="nav-drawer" hidden role="dialog" aria-modal="true" aria-label="Menü">
    <div class="nav-drawer-backdrop" data-drawer-close></div>
    <div class="nav-drawer-panel">
      <button class="nav-drawer-close" data-drawer-close aria-label="Menüyü kapat">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <nav class="nav-drawer-links" id="drawerLinks"></nav>
      <div class="nav-drawer-social" id="drawerSocial"></div>
    </div>
  </div>

  <!-- Arama -->
  <div id="searchModal" class="search-modal" hidden role="dialog" aria-modal="true" aria-label="Site içinde ara">
    <div class="search-modal-backdrop" data-close></div>
    <div class="search-modal-panel">
      <div class="search-modal-bar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="searchInput" type="search" placeholder="Yazı, video, podcast, remix ara..." autocomplete="off" spellcheck="false">
        <button class="search-modal-close" data-close aria-label="Kapat">esc</button>
      </div>
      <div id="searchResults" class="search-modal-results"></div>
      <div id="searchHint" class="search-modal-hint">Tüm site içinde arama. En az 2 harf yazın.</div>
    </div>
  </div>

  <main id="app"></main>

  <footer class="foot" id="foot"></footer>

  <!-- Global ses oynatıcı (podcast & remix) -->
  <div class="player" id="player" hidden>
    <div class="pl-in">
      <div class="pl-cover"></div>
      <div class="pl-controls">
        <button class="pl-skip" id="plBack" title="10 saniye geri" aria-label="10 saniye geri">
          <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.2 3.16-1.98 5.12-1.98 3.73 0 6.84 2.55 7.73 6h2.08c-.97-4.57-5.01-8-9.81-8z"/><text x="12" y="15.5" font-size="6.5" font-family="monospace" font-weight="bold" text-anchor="middle" fill="currentColor">10</text></svg>
        </button>
        <button class="pl-btn" id="plToggle" aria-label="Oynat / Duraklat">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button class="pl-skip" id="plFwd" title="10 saniye ileri" aria-label="10 saniye ileri">
          <svg viewBox="0 0 24 24"><path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.2-3.16-1.98-5.12-1.98-3.73 0-6.84 2.55-7.73 6H1.69c.97-4.57 5.01-8 9.81-8z"/><text x="12" y="15.5" font-size="6.5" font-family="monospace" font-weight="bold" text-anchor="middle" fill="currentColor">10</text></svg>
        </button>
      </div>
      <div class="pl-meta">
        <a class="pl-title" href="#/"></a>
        <span class="pl-sub"></span>
      </div>
      <span class="pl-time" id="plCur">0:00</span>
      <div class="pl-bar" id="plBar" role="slider" aria-label="İlerleme"><div class="pl-prog" id="plProg"></div></div>
      <span class="pl-time" id="plDur">0:00</span>
      <button class="pl-speed" id="plSpeed" title="Çalma Hızı">1x</button>
      <div class="pl-vol-wrap">
        <button class="pl-vol-btn" id="plVolBtn" title="Sesi Aç / Kapat" aria-label="Ses">
          <svg class="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg class="i-mute" viewBox="0 0 24 24" hidden><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <input type="range" class="pl-vol-slider" id="plVol" min="0" max="1" step="0.05" value="1" title="Ses Seviyesi">
      </div>
      <button class="pl-close" id="plClose" aria-label="Oynatıcıyı kapat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </div>

  <script src="js/ornek-icerik.js"></script>
  <script src="js/store.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
